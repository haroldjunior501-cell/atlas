<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Atlas</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body {
      background:
        radial-gradient(circle at 50% 42%, rgba(37, 99, 235, 0.34), transparent 46%),
        #000;
    }
    canvas { display: block; width: 100% !important; height: 100% !important; }
    #status {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 12px;
      color: rgba(255, 255, 255, 0.8);
      font: 14px/1.4 sans-serif;
      text-align: center;
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "/vendor/three/three.module.js" } }
  </script>
</head>
<body>
  <div id="status">Atlas…</div>
  <script type="module">
    import * as THREE from 'three'
    import { GLTFLoader } from '/vendor/three/addons/loaders/GLTFLoader.js'

    const status = document.getElementById('status')
    const post = (ready) => {
      const payload = JSON.stringify({ type: 'atlas-face', ready })
      if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(payload)
    }

    let listeningOn = false
    let speakingOn = false
    let speechText = ''
    let timeline = []
    let anchor = { char: 0, time: 0, rate: 13.5 }
    let neuralMode = 'off'
    let playedFor = ''
    let voiceToken = 0
    let humanAudio = null

    let lastCaption = -1
    let lastCaptionAt = 0

    function postVoice(event, char) {
      const payload = JSON.stringify({
        type: 'atlas-voice',
        event,
        char: typeof char === 'number' ? Math.max(0, Math.floor(char)) : undefined,
      })
      if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(payload)
    }

    function stopHuman() {
      if (!humanAudio) return
      humanAudio.pause()
      const src = humanAudio.src
      humanAudio.src = ''
      humanAudio = null
      if (src.startsWith('blob:')) URL.revokeObjectURL(src)
    }

    async function playNeural(text) {
      const mine = ++voiceToken
      stopHuman()
      lastCaption = -1
      neuralMode = 'pending'
      try {
        const res = await fetch('/api/atlas/speak', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ text: String(text || '').slice(0, 1800) }),
        })
        if (!res.ok) throw new Error('tts')
        const blob = await res.blob()
        if (blob.size < 200) throw new Error('short')
        if (mine !== voiceToken) return
        const audio = new Audio()
        audio.setAttribute('playsinline', 'true')
        audio.src = URL.createObjectURL(blob)
        humanAudio = audio
        audio.onended = () => {
          if (mine !== voiceToken) return
          neuralMode = 'off'
          postVoice('end')
        }
        await audio.play()
        if (mine !== voiceToken) {
          audio.pause()
          return
        }
        neuralMode = 'play'
        postVoice('start')
      } catch {
        if (mine !== voiceToken) return
        neuralMode = 'device'
        postVoice('fail')
      }
    }

    const DIGRAPHS = [
      ['eau', 'oh'], ['oeu', 'ou'], ['ain', 'E'], ['ein', 'E'], ['ch', 'CH'],
      ['ou', 'ou'], ['oi', 'oh'], ['on', 'oh'], ['om', 'oh'], ['an', 'aa'],
      ['am', 'aa'], ['en', 'aa'], ['em', 'aa'], ['in', 'E'], ['im', 'E'],
      ['un', 'ou'], ['au', 'oh'], ['eu', 'ou'], ['ai', 'E'], ['ei', 'E'],
      ['qu', 'kk'], ['ph', 'FF'], ['gn', 'nn'],
    ]
    const LETTER = {
      a: 'aa', à: 'aa', â: 'aa', e: 'E', é: 'E', è: 'E', ê: 'E', ë: 'E',
      i: 'ih', î: 'ih', y: 'ih', o: 'oh', ô: 'oh', u: 'ou', ù: 'ou', û: 'ou',
      p: 'PP', b: 'PP', m: 'PP', f: 'FF', v: 'FF', t: 'TH', d: 'DD',
      n: 'nn', l: 'nn', k: 'kk', g: 'kk', q: 'kk', c: 'kk', s: 'SS', z: 'SS',
      x: 'SS', j: 'CH', r: 'RR', w: 'ou', h: 'sil',
    }
    const SHAPE = {
      sil: { jaw: 0.02, smile: 0.05, purse: 0, funnel: 0, close: 0.45 },
      PP: { jaw: 0, smile: 0, purse: 0.12, funnel: 0, close: 0.92 },
      FF: { jaw: 0.12, smile: 0.08, purse: 0, funnel: 0.28, close: 0.18 },
      TH: { jaw: 0.2, smile: 0.08, purse: 0, funnel: 0.06, close: 0.04 },
      DD: { jaw: 0.22, smile: 0.04, purse: 0, funnel: 0.04, close: 0.08 },
      kk: { jaw: 0.16, smile: 0.12, purse: 0, funnel: 0, close: 0.06 },
      CH: { jaw: 0.18, smile: 0, purse: 0.28, funnel: 0.5, close: 0 },
      SS: { jaw: 0.08, smile: 0.5, purse: 0, funnel: 0.06, close: 0.12 },
      nn: { jaw: 0.1, smile: 0.04, purse: 0.06, funnel: 0, close: 0.36 },
      RR: { jaw: 0.22, smile: 0.04, purse: 0, funnel: 0.14, close: 0 },
      aa: { jaw: 0.72, smile: 0.08, purse: 0, funnel: 0.05, close: 0 },
      E: { jaw: 0.36, smile: 0.46, purse: 0, funnel: 0, close: 0 },
      ih: { jaw: 0.18, smile: 0.58, purse: 0, funnel: 0, close: 0 },
      oh: { jaw: 0.4, smile: 0.04, purse: 0.22, funnel: 0.66, close: 0 },
      ou: { jaw: 0.1, smile: 0, purse: 0.82, funnel: 0.38, close: 0.06 },
    }

    function buildTimeline(text) {
      const spoken = String(text || '')
      const out = []
      let i = 0
      while (i < spoken.length) {
        const ch = spoken[i]
        if (!/\p{L}/u.test(ch)) {
          out.push({ charIndex: i, ...SHAPE.sil })
          i += 1
          continue
        }
        const rest = spoken.slice(i).toLowerCase()
        let hit = null
        for (const [glyph, viseme] of DIGRAPHS) {
          if (rest.startsWith(glyph)) { hit = { glyph, viseme }; break }
        }
        if (hit) {
          const shape = SHAPE[hit.viseme]
          for (let k = 0; k < hit.glyph.length; k += 1) out.push({ charIndex: i + k, ...shape })
          i += hit.glyph.length
          continue
        }
        out.push({ charIndex: i, ...(SHAPE[LETTER[ch.toLowerCase()] || 'sil'] || SHAPE.sil) })
        i += 1
      }
      return out
    }

    function shapeAt(charPos) {
      if (!timeline.length) return SHAPE.sil
      const pos = Math.max(0, Math.min(timeline.length - 1, charPos))
      const index = Math.floor(pos)
      const next = timeline[Math.min(timeline.length - 1, index + 1)]
      const cur = timeline[index]
      const mix = pos - index
      const blend = (key) => cur[key] * (1 - mix) + next[key] * mix
      const ahead = mix > 0.45 ? 0.35 : 0.12
      return {
        jaw: blend('jaw') * (1 - ahead) + next.jaw * ahead,
        smile: blend('smile') * (1 - ahead) + next.smile * ahead,
        purse: blend('purse') * (1 - ahead) + next.purse * ahead,
        funnel: blend('funnel') * (1 - ahead) + next.funnel * ahead,
        close: blend('close'),
      }
    }

    window.__atlasFaceApply = (state) => {
      if (!state) return
      if (typeof state.listening === 'boolean') listeningOn = state.listening
      if (typeof state.speech === 'string' && state.speech !== speechText) {
        speechText = state.speech
        timeline = buildTimeline(speechText)
      }
      if (typeof state.speaking === 'boolean') {
        if (!state.speaking) {
          voiceToken += 1
          stopHuman()
          neuralMode = 'off'
          playedFor = ''
          speakingOn = false
          return
        }
        if (!speakingOn) {
          anchor = { char: 0, time: performance.now(), rate: anchor.rate || 13.5 }
        }
        speakingOn = true
      }
      if (state.engine === 'device') {
        if (neuralMode !== 'device') {
          voiceToken += 1
          stopHuman()
          neuralMode = 'device'
          playedFor = speechText || playedFor
          anchor = { char: 0, time: performance.now(), rate: anchor.rate || 13.5 }
        }
      } else if (speakingOn && speechText && speechText !== playedFor) {
        playedFor = speechText
        void playNeural(speechText)
      }
      if (neuralMode === 'device' && typeof state.char === 'number' && speakingOn) {
        const now = performance.now()
        const dt = (now - anchor.time) / 1000
        if (state.char > anchor.char + 0.5 && dt > 0.05 && dt < 1.2) {
          const measured = (state.char - anchor.char) / dt
          anchor.rate = Math.min(20, Math.max(9, measured * 0.7 + anchor.rate * 0.3))
        }
        anchor = { char: state.char, time: now, rate: anchor.rate }
      }
    }

    let renderer
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, premultipliedAlpha: true })
    } catch (error) {
      status.textContent = 'WebGL indisponible'
      post(false)
      throw error
    }
    renderer.setClearColor(0x000000, 0)
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2))
    renderer.setSize(window.innerWidth, window.innerHeight, false)
    renderer.outputColorSpace = THREE.SRGBColorSpace
    renderer.toneMapping = THREE.ACESFilmicToneMapping
    renderer.toneMappingExposure = 1.12
    document.body.appendChild(renderer.domElement)

    const scene = new THREE.Scene()
    const camera = new THREE.PerspectiveCamera(32, window.innerWidth / Math.max(window.innerHeight, 1), 0.05, 40)
    camera.position.set(0, 0.04, 1.15)
    scene.add(new THREE.AmbientLight(0xc8b8a8, 0.72))
    const key = new THREE.DirectionalLight(0xffe8d6, 1.35)
    key.position.set(0.45, 0.75, 1.2)
    scene.add(key)
    const fill = new THREE.DirectionalLight(0xb8c4e0, 0.45)
    fill.position.set(-0.9, 0.25, 0.9)
    scene.add(fill)
    const rim = new THREE.DirectionalLight(0xffc9a8, 0.28)
    rim.position.set(-0.2, 0.55, -1.0)
    scene.add(rim)

    const root = new THREE.Group()
    scene.add(root)

    const morph = { jaw: -1, smile: -1, purse: -1, funnel: -1, close: -1 }
    const smooth = { jaw: 0, smile: 0.04, purse: 0, funnel: 0, close: 0.2 }
    let baseCamZ = 1.15
    let faceMesh = null

    function amplify(geometry, index, factor) {
      const attr = geometry.morphAttributes.position?.[index]
      if (!attr || typeof attr.setXYZ !== 'function') return
      for (let i = 0; i < attr.count; i += 1) {
        attr.setXYZ(i, attr.getX(i) * factor, attr.getY(i) * factor, attr.getZ(i) * factor)
      }
      attr.needsUpdate = true
    }

    function frameModel(model) {
      model.rotation.x = -Math.PI / 2
      model.updateMatrixWorld(true)
      const box = new THREE.Box3().makeEmpty()
      model.traverse((obj) => {
        if (!(obj instanceof THREE.Mesh) || !obj.visible || !obj.morphTargetInfluences) return
        obj.geometry.computeBoundingBox()
        const geoBox = obj.geometry.boundingBox
        if (!geoBox) return
        box.union(geoBox.clone().applyMatrix4(obj.matrixWorld))
      })
      if (box.isEmpty()) box.setFromObject(model)
      const size = box.getSize(new THREE.Vector3())
      const center = box.getCenter(new THREE.Vector3())
      const targetH = 0.78
      const scale = targetH / Math.max(size.y, 0.001)
      model.scale.setScalar(scale)
      model.position.set(-center.x * scale, -center.y * scale + 0.02, -center.z * scale)
      baseCamZ = Math.max(1.0, targetH / (2 * Math.tan((camera.fov * Math.PI) / 360)) * 1.2)
      camera.position.set(0, 0.04, baseCamZ)
      camera.lookAt(0, 0.04, 0)
    }

    function tune(mesh) {
      const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material]
      for (const mat of mats) {
        if (!mat || (!mat.isMeshStandardMaterial && !mat.isMeshPhysicalMaterial)) continue
        mat.metalness = 0
        mat.roughness = Math.min(0.55, Math.max(0.32, mat.roughness || 0.42))
        mat.side = THREE.FrontSide
        if (mat.map) {
          mat.map.colorSpace = THREE.SRGBColorSpace
          mat.map.flipY = false
          mat.map.needsUpdate = true
        }
        if (mat.isMeshPhysicalMaterial) {
          mat.sheen = 0.18
          mat.sheenRoughness = 0.65
          if (mat.sheenColor) mat.sheenColor.set(0xffd8c4)
          mat.clearcoat = 0
        }
        mat.envMapIntensity = 0
        mat.needsUpdate = true
      }
    }

    new GLTFLoader().load(
      '/avatars/atlas-flame.glb',
      (gltf) => {
        const model = gltf.scene
        model.traverse((obj) => {
          if (!(obj instanceof THREE.Mesh)) return
          if (/ico/i.test(obj.name) && !/flame/i.test(obj.name)) {
            obj.visible = false
            return
          }
          obj.frustumCulled = false
          if (obj.morphTargetInfluences && obj.morphTargetDictionary && morph.jaw < 0) {
            const dict = obj.morphTargetDictionary
            const jaw = dict.Pose1 ?? dict.pose1
            if (typeof jaw === 'number') {
              amplify(obj.geometry, jaw, 4.6)
              morph.jaw = jaw
              morph.smile = dict.Exp2 ?? -1
              morph.purse = dict.Exp3 ?? -1
              morph.funnel = dict.Exp4 ?? -1
              morph.close = dict.Exp8 ?? -1
              faceMesh = obj
            }
          }
          tune(obj)
        })
        root.add(model)
        frameModel(model)
        status.textContent = ''
        post(true)
      },
      undefined,
      () => {
        status.textContent = 'Modèle Atlas introuvable'
        post(false)
      },
    )

    const clock = new THREE.Clock()
    let lastTick = 0
    const animate = () => {
      const t = clock.getElapsedTime()
      const dt = Math.min(0.05, Math.max(0.001, t - lastTick))
      lastTick = t
      const duration = humanAudio && Number.isFinite(humanAudio.duration) ? humanAudio.duration : 0
      const neuralLive = neuralMode === 'play' && duration > 0.05 && timeline.length > 0
      const deviceLive = neuralMode === 'device' && speakingOn && timeline.length > 0
      const live = neuralLive || deviceLive
      root.rotation.y = Math.sin(t * 0.28) * 0.028
      root.rotation.x = live ? Math.sin(t * 1.6) * 0.008 + smooth.jaw * 0.02 : Math.sin(t * 0.5) * 0.004
      root.position.y = Math.sin(t * 0.9) * 0.004
      let target = { jaw: 0, smile: 0.04, purse: 0, funnel: 0, close: 0.16 }
      if (neuralLive) {
        const ratio = Math.min(1, Math.max(0, (humanAudio.currentTime + 0.04) / duration))
        const char = Math.min(speechText.length, Math.round(ratio * speechText.length))
        const now = performance.now()
        if (char !== lastCaption && now - lastCaptionAt > 70) {
          lastCaption = char
          lastCaptionAt = now
          postVoice('tick', char)
        }
        target = shapeAt(ratio * (timeline.length - 1))
        if (target.close > 0.55) target.jaw = Math.min(target.jaw, 0.04)
      } else if (deviceLive) {
        const elapsed = (performance.now() - anchor.time) / 1000
        const char = anchor.char + Math.max(0, elapsed + 0.04) * anchor.rate
        target = shapeAt(Math.min(timeline.length - 1, char))
        if (target.close > 0.55) target.jaw = Math.min(target.jaw, 0.04)
      }
      const follow = (key, openRate, shutRate) => {
        const goal = target[key]
        const rate = goal > smooth[key] ? openRate : shutRate
        smooth[key] += (goal - smooth[key]) * (1 - Math.exp(-rate * dt))
      }
      follow('jaw', 26, 38)
      follow('smile', 18, 22)
      follow('purse', 22, 34)
      follow('funnel', 22, 30)
      follow('close', 34, 42)
      if (faceMesh) {
        const set = (index, value) => {
          if (index >= 0) faceMesh.morphTargetInfluences[index] = Math.max(0, Math.min(1, value))
        }
        set(morph.jaw, smooth.jaw)
        set(morph.smile, smooth.smile)
        set(morph.purse, smooth.purse)
        set(morph.funnel, smooth.funnel)
        set(morph.close, smooth.close * 0.28)
      }
      camera.position.z = baseCamZ - (listeningOn ? 0.04 : 0)
      renderer.render(scene, camera)
      requestAnimationFrame(animate)
    }
    animate()

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / Math.max(window.innerHeight, 1)
      camera.updateProjectionMatrix()
      renderer.setSize(window.innerWidth, window.innerHeight, false)
    })
  </script>
</body>
</html>
