# NVIDIA voice_agent_examples layout: ASR + LLM + TTS.
# Local LLM = ACE_LLM / Qwen GGUF via llama.cpp (OpenAI-compatible :8000/v1).
# Maya-ACE consumes the viseme clip returned by POST /api/atlas/voice (player: maya-ace-a2f).

name: atlas-ace

services:
  atlas-llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    ports:
      - "8000:8080"
    volumes:
      - ${ATLAS_LLM_GGUF}:/models/model.gguf:ro
    command: ["-m", "/models/model.gguf", "--port", "8080", "--host", "0.0.0.0", "-c", "4096", "--jinja"]
    environment:
      LLAMA_ARG_N_PARALLEL: "1"
    restart: unless-stopped

  atlas-voice:
    build: ./voice_agent
    ports:
      - "8090:8090"
    env_file:
      - ../../.env
    environment:
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-http://atlas-llm:8080/v1}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-qwen3-4b}
      NVIDIA_LLM_URL: ${NVIDIA_LLM_URL:-http://atlas-llm:8080/v1}
      ASR_SERVER_URL: ${ASR_SERVER_URL:-}
      TTS_SERVER_URL: ${TTS_SERVER_URL:-}
      RIVA_ASR_URL: ${RIVA_ASR_URL:-}
      RIVA_TTS_URL: ${RIVA_TTS_URL:-}
    depends_on:
      - atlas-llm
    restart: unless-stopped
